interface:
  display_name: "乔木 Obsidian 开发"
  short_description: "阅读优先的插件开发、原生交互与真实发布验证"
  default_prompt: "Use $qiaomu-obsidian-dev to develop or review this Obsidian plugin. Preserve native note workflows and reading state, follow the scoped references, verify in a QA vault, and report release stages separately. Publish only when authorized."
compatibility:
  adapter_targets: [openai, claude, generic, agent-skills-compatible]
  trust:
    remote_inline_execution: forbid
  permissions:
    file_write: "authorized repository and QA vault only"
    network: "official documentation and authorized publication"
